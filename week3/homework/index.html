<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make Buttons Do Stuff</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body id="docBody">

    <main id="gallery">

        <section id="thumbStrip">
            <button id="prevBtn" class="arrowBtn" aria-label="Scroll thumbnails left">&lsaquo;</button>

            <div id="thumbnails">
                <div class="thumb selected">
                    <img src="images/europe1.jpg" alt="First European picture" id="thumb1">
                </div>
                <div class="thumb">
                    <img src="images/europe2.jpg" alt="Second European picture" id="thumb2">
                </div>
                <div class="thumb">
                    <img src="images/europe3.jpg" alt="Third European picture" id="thumb3">
                </div>
                <div class="thumb">
                    <img src="images/europe4.jpg" alt="Fourth European picture" id="thumb4">
                </div>
            </div>

            <button id="nextBtn" class="arrowBtn" aria-label="Scroll thumbnails right">&rsaquo;</button>
        </section>

        <section id="focusArea">
            <img src="images/europe1.jpg" alt="First European picture" id="focusPic">
        </section>

    </main>

</body>

<script src="script.js"></script>
</html>
